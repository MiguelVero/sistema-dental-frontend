<aside [class.collapsed]="!menuAbierto" class="sidebar">
  <div class="sidebar-header">
    <h2 *ngIf="menuAbierto" class="sidebar-title">🦷 Perfect Dent</h2>
    <button (click)="toggleSidebar()" class="toggle-btn">
      {{menuAbierto ? '◀' : '▶'}}
    </button>
  </div>
  
  <nav class="nav-menu">
    <ng-container *ngFor="let item of menuItems">
      <ng-container *ngIf="tienePermiso(item)">
        <!-- Item simple -->
        <a *ngIf="!item.submenu" 
           [routerLink]="item.ruta"
           routerLinkActive="active"
           class="nav-item">
          <span class="nav-icon">{{item.icono}}</span>
          <span class="nav-text">{{item.titulo}}</span>
        </a>
        
        <!-- Item con submenu -->
        <div *ngIf="item.submenu">
          <button (click)="toggleSubmenu(item)" class="nav-item">
            <span class="nav-icon">{{item.icono}}</span>
            <span class="nav-text">{{item.titulo}}</span>
            <span class="submenu-arrow">{{item.abierto ? '▲' : '▼'}}</span>
          </button>
          
          <div *ngIf="item.abierto" class="submenu">
            <a *ngFor="let sub of item.submenu"
               [routerLink]="sub.ruta"
               routerLinkActive="active"
               class="nav-item">
              <span class="nav-icon">{{sub.icono}}</span>
              <span class="nav-text">{{sub.titulo}}</span>
            </a>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </nav>
</aside>
