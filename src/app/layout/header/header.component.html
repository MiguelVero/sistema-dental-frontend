<header class="header">
  <div class="header-content">
    <div class="header-left">
      <h1>🦷 Clínica Dental - Sistema de Gestión</h1>
    </div>
    
    <div class="header-right">
      <!-- Notificaciones -->
      <div class="relative">
        <button (click)="toggleNotificaciones()" class="notification-btn">
          <span>🔔</span>
          <span *ngIf="notificaciones.length > 0" class="badge">
            {{notificaciones.length}}
          </span>
        </button>
        
<!-- Dropdown notificaciones -->
<div *ngIf="notificacionesAbierto" class="notifications-dropdown">
  <div class="notif-header">
    <h3>Notificaciones</h3>
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <span class="notif-count">{{notificaciones.length}} nuevas</span>
      <button *ngIf="notificaciones.length > 0" 
              (click)="limpiarNotificaciones()" 
              class="limpiar-btn"
              title="Marcar todas como leídas">
        ✔️
      </button>
    </div>
  </div>
  <div class="notif-list">
    <div *ngFor="let notif of notificaciones; let i = index" 
         class="notif-item"
         (click)="navegarDesdeNotificacion(notif, i)">
      <span class="text-xl">{{notif.icono}}</span>
      <div class="flex-1">
        <p class="text-sm">{{notif.mensaje}}</p>
        <p class="text-xs text-gray-500">{{notif.tiempo}}</p>
      </div>
    </div>
    <div *ngIf="notificaciones.length === 0" class="notif-empty">
      No hay notificaciones
    </div>
  </div>
</div>
      </div>
      
      <!-- Perfil -->
      <div class="profile-menu" (click)="toggleMenu()">
        <button class="profile-btn">
          <div class="avatar">
            {{usuario?.nombre?.charAt(0) || 'U'}}
          </div>
          <span class="username">{{usuario?.nombre || 'Usuario'}}</span>
          <span class="arrow">▼</span>
        </button>
        
        <!-- Dropdown -->
        <div *ngIf="menuAbierto" class="dropdown">
          <div class="dropdown-header">
            <p class="user-name">{{usuario?.nombre}}</p>
            <p class="user-role">{{usuario?.rol}}</p>
          </div>
          <a routerLink="/perfil" class="dropdown-item">👤 Perfil</a>
          <!-- SOLO ADMIN VE CONFIGURACIÓN -->
          <a *ngIf="usuario?.rol === 'administrador'" routerLink="/configuracion" class="dropdown-item">⚙️ Configuración</a>
          <button (click)="logout()" class="dropdown-item logout-btn">
            🚪 Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
