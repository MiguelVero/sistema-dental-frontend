<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-8">
      <div class="logo">🦷</div>
      <h1>Perfect Dent</h1>
      <p>Sistema de Gestión Dental</p>
    </div>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input 
          type="email"
          [(ngModel)]="email"
          name="email"
          class="form-input"
          placeholder="usuario@clinica.com"
          required
        >
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <input 
          type="password"
          [(ngModel)]="password"
          name="password"
          class="form-input"
          placeholder="••••••••"
          required
        >
      </div>
      
      <button 
        type="submit"
        [disabled]="loading"
        class="btn-submit"
      >
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading">Iniciando sesión...</span>
      </button>
      
      <div class="text-center mt-4">
      <a (click)="recuperarPassword()" class="forgot-password" style="cursor: pointer;">
        ¿Olvidaste tu contraseña?
      </a>
    </div>
    </form>
  </div>
</div>
